# 메인 WANTS CONTENT 블로그 목록 : 네이버 블로그 최신 글 3개 → data/blog.json (scripts/fetch-blog.mjs)
name: 블로그 최신 글 업데이트

on:
  schedule:
    - cron: '0 0 * * *' # 매일 오전 9시 (한국 시간) = UTC 0시 · GitHub 사정에 따라 수십 분 늦게 실행될 수 있음
  workflow_dispatch: # Actions 탭의 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write # data/blog.json 커밋 · 푸시

concurrency:
  group: update-blog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: RSS 받아서 data/blog.json 갱신
        run: node scripts/fetch-blog.mjs

      - name: 변경이 있을 때만 커밋
        run: |
          if [ -z "$(git status --porcelain -- data/blog.json)" ]; then
            echo "변경 없음 - 커밋하지 않음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog.json
          git commit -m "블로그 최신 글 업데이트"
          git push
